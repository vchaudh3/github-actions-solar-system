name: Invoke Reusable Workflow-1944

on: [push]

jobs:
  call-workflow:
    uses: ./.github/workflows/my-reusable-workflow.yml
    with:
      my_input: "Hello, World!"

  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
    steps:
      - id: setver
        run: echo "version=2.0.0" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - run: echo "Deploying version ${{ needs.generate.outputs.version }}"

  example:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 – Set env var
        run: echo "VERSION=1.2.3" >> $GITHUB_ENV

      - name: Step 2 – Use env var
        run: echo "Deployed version is $VERSION"      
